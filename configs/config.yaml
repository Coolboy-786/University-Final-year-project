defaults:
  - data: merged
  - model: ensemble
  - preprocessing: routed
  - _self_

seed: 42
output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}

trainer:
  max_epochs: 20
  accelerator: auto
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10

logging:
  wandb:
    enabled: true
    project: skin-disease-classification
    entity: null
  tensorboard:
    enabled: false
